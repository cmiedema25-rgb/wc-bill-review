artifacts = ["/app/output/bill_review.csv"]
schema_version = "2.0"

[task]
name = "cmiedema/wc-bill-review"
description = "Audit 6,121 workers' compensation provider bills (15,473 CMS-1500 and UB-04 lines) across four states and determine the allowed and still-payable amount of every line, from claim files, body part determinations, state fee schedules with dated conversion factors, regulation excerpts, a procedure edit table, PPO network agreements and rosters, and the payment history."

[metadata]
difficulty_explanation = """Workers' compensation medical bill reviewers and bill review auditors reprice provider bills against state fee schedules, because overpayment is a direct loss and underpayment draws state penalties and provider disputes. The data is synthetic but follows real bill review files: 950 claims in KY, NM, SC and ID, 6,121 professional and facility bills with 15,473 lines, 5,785 payment and reversal entries, 347 providers, a network roster, three PPO agreements, four states' professional and facility schedules with conversion factors by effective date, a procedure edit table, a diagnosis-to-body-part map, four regulation excerpts and the insurer's procedures. The instruction names none of the rules, and each moves a different subset of lines. Conversion factors changed on April 1, 2026, and a proposed factor that was never adopted sits in the same table, so the factor must follow the date of service, not the received date or the latest row. Each PPO agreement takes its discount off the fee schedule amount in some jurisdictions and off billed charges in others, written only in the agreement prose, and applies only while the provider is on the roster; the provider master shows a stale network. Payment is the lesser of billed, schedule and contract amounts. Multiple procedures by one provider on one date are ranked by schedule amount, across separate bills, with a third-procedure rate that differs by state; modifier 51 on the bill is often on the wrong line. Edit pairs deny the component code across bills unless the pair allows a 59 or XS override. Facility bills package anesthesia, recovery and status N items, discount additional status T procedures, and pay uncoded pharmacy and supplies at a state percent of charges. Replacement and void frequency codes, chained replacements, exact duplicates of active bills, and new originals sent after a void (which look like duplicates of the voided bill but are not) decide which bills pay at all. Compensability turns on the most recent determination for each body part, on the first diagnosis pointer of a CMS-1500 line or the principal diagnosis of a UB-04, with laterality, and on dates before the injury. Services rendered out of state are priced under the jurisdiction's schedule, the place of service's schedule, or the lesser of the two, depending on the jurisdiction and whether the place of service has a schedule, using the service facility location rather than the billing office. Finally, payments already issued for the same service on any non-voided bill, including replaced originals and duplicates, net against the line, reversals cancel payments, and payments on voided bills are not credited. On 32 generator seeds every scripted shortcut fails all 32: billed charges (3% or fewer of bills within band), the latest conversion factor (63% or fewer), the received-date factor (85% or fewer), including the proposed factor (97% or fewer), a single PPO base everywhere (86% or fewer), no PPO (78% or fewer), the provider master's network (98% or fewer), no billed cap, no or misapplied multiple procedure reduction (per bill, by modifier 51, by bill order, flat 50%), no or misapplied bundling, ignoring frequency codes or duplicates or treating rebills as duplicates, no or loose body part checks (any pointer, claimed parts, no laterality, first or any acceptance), no pre-injury check, a single out-of-state rule or the billing office state, no netting, netting only on the same line, crediting voided bills, ignoring reversals, no facility packaging or discount, a flat assistant rate, 200% bilateral, and pairs; the closest, bundling per bill and the billing office state, still miss the bill or total band on every seed."""
solution_explanation = """Resolve bill history first: a frequency 8 bill voids its original, a frequency 7 bill supersedes its original (follow chains), and a frequency 1 bill whose claim, provider and full set of lines match an earlier bill that is still active is a duplicate; voided, superseded, void and duplicate bills pay nothing. For each remaining line, take the current (latest dated) determination for each body part, map the first diagnosis pointer (CMS-1500) or principal diagnosis (UB-04) to its body part with laterality, and deny lines for non-accepted parts or dated before the injury. Deny edit-table column 2 codes billed by the same provider for the same claim and date as their column 1 code on any live bill, unless the indicator is 1 and the line carries 59 or XS. Price under the governing schedule: the jurisdiction's, except NM uses the place of service's schedule and rules when it is KY, SC or ID, and SC takes the lesser of its own and that state's; the place of service is service_facility_state. Professional amount is RVU times the adopted conversion factor in effect on the date of service (or flat fee) times units, 150% for modifier 50 on bilateral codes, the state assistant rate (16% KY/SC, 20% NM/ID) for modifier 80 where allowed; rank indicator-2 procedures of one provider, claim and date across bills by that amount and pay 100%, 50%, then 50% (KY, SC) or 25% (NM, ID). Facility amount is weight times the facility factor by date of service, zero for status N and revenue codes 037X/071X, the state percent of billed charges for uncoded 025X/027X lines, and 50% for every status T line after the highest on the bill. If the provider is on a network roster on the date of service, the contract rate is the schedule or billed amount (per the agreement's clause for the claim's jurisdiction) less the network discount. Allowed is the lesser of billed, schedule and contract amounts. Payable is allowed less the net of payments and reversals for the same claim, provider, date and code on bills that were not voided, never below zero. Runs in a few seconds."""
verification_explanation = """The verifier reads only /app/output/bill_review.csv. The header must be exactly bill_id,line_no,allowed_usd,payable_usd with one row per bill line and a total row with an empty line_no, finite non-negative amounts, and the total equal to the sums of the lines. Ground truth (tests/truth.json, baked into the verifier image) is the generator's amount per line, computed from how it created each bill (original, duplicate, replacement, void, rebill) and the rules above, not by detecting them from the files. `python3 authoring/generate_data.py` reproduces it and the data byte for byte (seed 311). At least 99% of lines must have allowed_usd and, separately, payable_usd within 0.5% or $0.50, whichever is larger; at least 99.7% of bills must have total payable_usd within 0.5% or $1.00; and total allowed and total payable must each be within 0.25%. The floors absorb cent-level rounding differences between valid implementations. Across 32 seeds (301-332) the reference and an independent line-by-line rules engine that rounds at every pricing step both pass 32/32 with 100% of lines and bills in band and totals within 0.001%. Every scripted shortcut fails all 32 seeds; the bill band (99.7%) is what catches the rarer effects, whose single-effect shortcuts reach 98.2% to 99.7% of bills, and those that reach the bill threshold miss the 0.25% total band. Reward is 1 only if all six tests pass."""
category = "Operations"
subcategory = "Claims"
tags = ["insurance-claims", "workers-compensation", "medical-bill-review", "fee-schedule", "claims-audit", "provider-reimbursement", "regulatory-compliance"]
expert_time_estimate_hours = 7.0
relevant_experience = """Workers' compensation claims operations: medical bill review and repricing under state fee schedules, correct coding edits, multiple procedure and facility payment rules, PPO network contracts, claim frequency codes and duplicate handling, and payment reconciliation."""

